# Continuous integration — runs on every push and pull request.
# Fast feedback loop: typecheck, smoke tests, Vite production build.
# The heavy Tauri cross-platform builds live in release.yml (tag-triggered).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + smoke tests + Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict — noUnusedLocals/Parameters)
        run: npm run lint

      - name: Run bidirectional LTE smoke test (Phase 1)
        run: npx tsx scripts/test-bidirectional-lte.ts

      - name: Run Phase 3 regression sweep
        run: npx tsx scripts/test-phase3-regression.ts

      # v0.4.0 smoke tests: segmentation, ghost-gate, webllm-catalog.
      # v0.4.1 smoke tests: gemini-model-config, doc-id, export.
      # Each exits non-zero on any failure.
      - name: Run segmentation test suite (v0.4.0)
        run: npx tsx scripts/test-segmentation.ts

      - name: Run ghost-gate test suite (v0.4.0)
        run: npx tsx scripts/test-ghost-gate.ts

      - name: Run WebLLM catalog test suite (v0.4.0)
        run: npx tsx scripts/test-webllm-catalog.ts

      - name: Run Gemini model config test suite (v0.4.1)
        run: npx tsx scripts/test-gemini-model-config.ts

      - name: Run doc-id test suite (v0.4.1)
        run: npx tsx scripts/test-doc-id.ts

      - name: Run export test suite (v0.4.1)
        run: npx tsx scripts/test-export.ts

      - name: Run Ollama PWA test suite (v0.4.2)
        run: npx tsx scripts/test-ollama-pwa.ts

      - name: Vite production build
        run: npm run build

      # Audit fix #14: scan Rust dependencies for known RUSTSEC advisories.
      # Runs cargo-audit against src-tauri/Cargo.lock. Fails the build if
      # any actual vulnerability (not just "unmaintained" warnings) is found.
      #
      # Note: we do NOT use --deny warnings here because Tauri 2 on Linux
      # transitively pulls in the GTK3 bindings (gtk, gtk-sys, gtk3-macros,
      # atk, sourceview, etc.) which are flagged as "unmaintained" — they
      # were superseded by GTK4 but Tauri 2.x hasn't migrated yet. These
      # are informational advisories, not exploitable vulnerabilities.
      # Using --deny warnings would fail the build on every push until
      # Tauri 3 ships. We deny only actual vulnerabilities.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit on Rust dependencies (vulnerabilities only)
        working-directory: src-tauri
        run: cargo audit

      - name: Upload Vite build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist/
          retention-days: 7
